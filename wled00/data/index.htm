<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LULU Lighting Dashboard</title>
    <style>
        :root { --bg:#f4f5f6; --surface:#fff; --ink:#25282c; --muted:#777d84; --line:#e2e4e7; }
        * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
        body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background-color:var(--bg); background-image:repeating-linear-gradient(45deg,transparent 0,transparent 23px,rgba(51,61,87,.025) 23px,rgba(51,61,87,.025) 24px),repeating-linear-gradient(-45deg,transparent 0,transparent 23px,rgba(51,61,87,.025) 23px,rgba(51,61,87,.025) 24px); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px 16px; }
        .app-container { width:100%; max-width:480px; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:32px 28px; box-shadow:0 12px 40px rgba(25,30,35,.045),0 2px 8px rgba(25,30,35,.025); }
        :root { --brand-blue:#323c5a; }
        .brand-image { display:block; width:100%; max-width:250px; height:auto; margin:0 auto; }
        .brand-header { position:relative; text-align:center; margin-bottom:32px; padding-top:48px; }
        .brand-logo { font-size:38px; font-weight:750; letter-spacing:-1.8px; color:var(--ink); text-transform:lowercase; margin-bottom:5px; }
        .brand-subtitle { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:2.8px; font-weight:650; }
        
        button { font-family:inherit; }
        .power-btn { position:absolute; top:0; right:0; width:46px; height:46px; display:flex; align-items:center; justify-content:center; background:#f5f6f7; border:1px solid var(--line); border-radius:12px; color:var(--brand-blue); cursor:pointer; transition:background .2s,border-color .2s; }
        .preset-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:30px; }
        .preset-btn { aspect-ratio:1/1; background:#fafafa; border:1px solid var(--line); border-radius:12px; color:var(--ink); display:flex; flex-direction:column; justify-content:center; align-items:center; cursor:pointer; transition:background .2s,border-color .2s,transform .15s; padding:16px; }
        .preset-btn .icon { font-size:26px; margin-bottom:12px; filter:grayscale(1); opacity:.72; }
        .preset-btn .label { font-size:14px; font-weight:600; color:var(--brand-blue); }
        .footer-navigation { display:flex; flex-direction:column; gap:10px; padding-top:22px; border-top:1px solid var(--line); }
        .wide-link { display:block; width:100%; padding:14px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:9px; color:var(--brand-blue); font-size:13px; font-weight:600; text-decoration:none; transition:background .2s,border-color .2s,transform .15s; }
        .power-btn:active,.preset-btn:active,.wide-link:active { transform:scale(.985); }
        :focus-visible { outline:2px solid var(--brand-blue); outline-offset:3px; }
        @media (hover:hover) { .power-btn:hover { background:#e7e9eb; border-color:#c8ccd0; } .preset-btn:hover,.wide-link:hover { background:#f3f4f5; border-color:#cbd0d4; } }
        @media (max-width:360px) { .app-container { padding:26px 18px; } .preset-grid { gap:10px; } }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
    </style>
</head>

<script>
    // Asynchronous network bridge connecting elements directly to the host API
    function sendWled(query) {
        fetch('/win&' + query)
        .then(res => { if (!res.ok) console.warn('Signal route dropped'); })
        .catch(err => console.error('Connection timed out:', err));
    }
</script>
